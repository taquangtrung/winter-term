name: Release

# Tag-driven. `git tag v0.1.0 && git push origin v0.1.0` builds every
# platform's installer and attaches them to a GitHub Release.
on:
  push:
    tags: ["v*"]
  # Lets a release be rehearsed against a branch without cutting a tag. The
  # publish job is skipped in that case; only the artifacts are produced.
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux (.deb)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libxdo-dev
      - run: cargo install cargo-deb --locked
      - run: make package
      - uses: actions/upload-artifact@v7
        with:
          name: linux-deb
          path: target/debian/*.deb
          if-no-files-found: error

  macos:
    name: macOS (.dmg)
    # Apple silicon runner. The .dmg it produces is arm64-only; an Intel build
    # would need a second job on macos-13 and a `lipo` merge.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: make package
      - uses: actions/upload-artifact@v7
        with:
          name: macos-dmg
          path: target/*.dmg
          if-no-files-found: error

  windows:
    name: Windows (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Not `make package`: the Windows runner has no make, and the Makefile's
      # Windows branch also handles the relaunch-from-inside-Winter dance that
      # only matters for a local `make install`. Here the two real steps are
      # spelled out instead.
      - name: Build release binary
        run: cargo build --release -p winter-term
      - name: Read version
        id: version
        shell: bash
        run: echo "value=$(grep '^version' Cargo.toml | head -1 | sed 's/version = \"\(.*\)\"/\1/')" >> "$GITHUB_OUTPUT"
      - name: Build installer
        shell: cmd
        env:
          WINTER_VERSION: ${{ steps.version.outputs.value }}
        run: '"C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /Q packaging\windows\installer.iss'
      - uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: target/*.exe
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    # Only a tag cuts a release; a manual run stops after building artifacts.
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: List artifacts
        run: ls -la artifacts
      - name: Extract release notes
        id: notes
        # The CHANGELOG section for this tag becomes the release body, so the
        # notes are written once, reviewed in the PR, and not retyped here.
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No CHANGELOG section for $version; falling back to autogenerated notes." \
              > release-notes.md
          fi
          cat release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          body_path: release-notes.md
          draft: true
          generate_release_notes: true
