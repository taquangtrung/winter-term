name: CI

# Cost shape: the Linux jobs run automatically because they are cheap and catch
# nearly everything. Windows and macOS are on demand and on a weekly schedule,
# because on a private repo GitHub bills their minutes at 2x and 10x, and a
# macOS run on every push would exhaust a month's allowance in about a dozen
# pushes. On a public repo all of this is free, so the schedule is the only
# thing keeping cross-platform breakage from rotting unnoticed.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "LICENSE", ".gitignore"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "LICENSE", ".gitignore"]
  schedule:
    # Mondays, 06:00 UTC. Catches a dependency or runner-image change that
    # breaks Windows or macOS without anyone touching the code.
    - cron: "0 6 * * 1"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Style and lint run once, on Linux only: they are target-independent, and
  # repeating them per-OS triples the cost for identical output.
  lint:
    name: rustfmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libxdo-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libxdo-dev
      # zsh and fish are what the shell-integration tests exercise; without
      # them those tests skip and the scripts go unverified.
      - name: Install test shells
        run: sudo apt-get install -y --no-install-recommends zsh fish
      - run: cargo test --workspace

  test-cross-platform:
    name: test (${{ matrix.os }})
    # Not on every push: see the cost note at the top of this file.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install test shells (macOS)
        if: runner.os == 'macOS'
        run: brew install fish
      - run: cargo test --workspace

  # Pins the floor advertised in `[workspace.package] rust-version`. Without
  # this the field is an unverified claim; with it, a dependency bump that
  # raises the real floor fails here instead of in a user's build.
  msrv:
    name: MSRV (1.96)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libxdo-dev
      - run: cargo check --workspace --all-targets

  python-client:
    name: python client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - working-directory: clients/client-py
        run: uv run --with pytest python -m pytest -q
      # ruff and mypy are declared dev dependencies and ruff is configured
      # in pyproject.toml, but nothing ran them, so violations accumulated.
      - working-directory: clients/client-py
        run: uv run --with ruff ruff check .
      - working-directory: clients/client-py
        run: uv run --with mypy mypy src

  # Advisories are published without anyone touching this repository, so the
  # weekly schedule above is what makes this job useful; a push-triggered run
  # alone would only ever check code that just changed. The workspace exists to
  # parse bytes it does not trust and the lockfile pulls in over 500 crates, so
  # an unreviewed advisory is the most likely way a problem arrives here.
  audit:
    name: security advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # A prebuilt binary; building cargo-audit from source on every run costs
      # more minutes than the check itself.
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo audit

  # Catches the crates.io rejections that only surface at publish time:
  # a missing description, an unreadable readme path, an excluded file.
  #
  # Only the crates with no unpublished internal dependencies can be checked.
  # A dry run resolves path dependencies against the real index, so winter-core
  # and winter-client cannot be verified until winter-proto is actually
  # published. That also fixes the release order:
  #   winter-proto -> winter-render -> winter-core -> winter-client -> winter-term
  publish-dry-run:
    name: publish dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The dry runs below cannot reach winter-term until its dependencies
      # are on the index, and this failure is silent locally: an embedded
      # path above the crate root resolves in the workspace and breaks only
      # for someone installing from the registry.
      - run: python3 scripts/check-embedded-paths.py
      # The installers copy files in by relative path, so a file that moves
      # in the repository breaks them silently until someone builds on the
      # matching OS.
      - run: python3 scripts/check-packaging-paths.py
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libxdo-dev
      - run: cargo publish --dry-run -p winter-proto --allow-dirty
      - run: cargo publish --dry-run -p winter-render --allow-dirty
