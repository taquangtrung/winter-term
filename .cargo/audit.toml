# Advisories that are acknowledged rather than fixable here.
#
# With this list in place CI runs `cargo audit --deny warnings`, so anything
# NOT listed below fails the build. Without it the 13 entries here would sit in
# every run as passing noise, and a new advisory would arrive looking exactly
# like them. Re-review this list whenever `wry` is upgraded: most of it goes
# away the day wry stops using GTK3.

[advisories]
ignore = [
    # The gtk-rs GTK3 binding set is retired upstream. It reaches us two ways
    # at once: through wry -> webkit2gtk, and as a direct dependency, because
    # embedding wry under winit on Linux means pumping GTK's main loop by hand
    # (three calls in the app crate). Neither path can drop it while wry is on
    # GTK3, so there is nothing to fix on this side.
    "RUSTSEC-2024-0412", # gdk
    "RUSTSEC-2024-0413", # atk
    "RUSTSEC-2024-0414", # gdkx11-sys
    "RUSTSEC-2024-0415", # gtk
    "RUSTSEC-2024-0416", # atk-sys
    "RUSTSEC-2024-0417", # gdkx11
    "RUSTSEC-2024-0418", # gdk-sys
    "RUSTSEC-2024-0419", # gtk3-macros
    "RUSTSEC-2024-0420", # gtk-sys
    "RUSTSEC-2024-0429", # glib, unsound VariantStrIter; same GTK3 chain

    # Build-time only: pulled in by a proc macro further down the tree, never
    # linked into the shipped binary.
    "RUSTSEC-2024-0370", # proc-macro-error

    # Font shaping, reached through cosmic-text. Moves when that crate moves.
    "RUSTSEC-2026-0192", # ttf-parser

    # Use-after-free in LruCache::pop if the value's Drop panics. Reached
    # through the graphics stack; none of our own types are cached in it.
    "RUSTSEC-2026-0253", # lru
]
