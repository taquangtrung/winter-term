[package]
name = "winter-textedit"
description = "Modal text editing for keyboard-driven apps: Emacs keys while typing, Vim motions, operators, and text objects for everything else, over text that knows nothing of files or windows."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["vim", "emacs", "modal", "text-editing", "keybindings"]
categories = ["text-editors", "gui"]
rust-version.workspace = true
include = ["Cargo.toml", "src/**/*.rs"]

[features]
# Helpers the host's tests build on: reading state a test checks.
test-support = []

[dependencies]
unicode-segmentation.workspace = true
unicode-width.workspace = true
winter-keys.workspace = true
winter-notify.workspace = true
