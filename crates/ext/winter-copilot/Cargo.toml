[package]
name = "winter-copilot"
description = "GitHub Copilot in Winter: ghost text and next edits from copilot-language-server, and the sign-in, as a bundled extension."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
publish = false

# Like every extension, it depends on the extension API alone. It ships
# built as a WebAssembly component, installed beside Winter:
# `cargo rustc -p winter-copilot --features wasm --release
# --target wasm32-wasip2 --crate-type cdylib`.
[dependencies]
serde_json.workspace = true
winter-ext-api.workspace = true
winter-ext-guest = { workspace = true, optional = true }

[features]
wasm = ["dep:winter-ext-guest"]
