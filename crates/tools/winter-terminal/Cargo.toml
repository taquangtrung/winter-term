[package]
name = "winter-terminal"
description = "Winter's terminal runtime: PTY terminals fed through its parser, the rich blocks programs emit, charts, and the image protocols."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["terminal", "pty", "emulator"]
categories = ["command-line-utilities"]
rust-version.workspace = true

[features]
# What tests in the crates built on this one use: feeding a terminal program
# output without a program.
test-support = []

[dependencies]
anyhow.workspace = true
base64.workspace = true
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
image = { workspace = true, features = ["png", "jpeg", "gif", "webp"] }
portable-pty.workspace = true
serde_json.workspace = true
vte.workspace = true
winter-base.workspace = true
winter-emulator.workspace = true
winter-model.workspace = true
winter-mux.workspace = true
winter-proto.workspace = true
winter-theme.workspace = true

[target.'cfg(windows)'.dependencies]
uds_windows = "1"
