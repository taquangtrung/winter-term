[package]
name = "winter-monitor"
description = "Winter's monitors: the machine's processes with the actions of a task manager, its processors, memory, traffic, GPUs, and disks, its sockets, and what starts at login."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["process-monitor", "system-monitor", "terminal", "editor"]
categories = ["command-line-utilities"]
rust-version.workspace = true

[dependencies]
misty.workspace = true
serde_json.workspace = true
winter-model.workspace = true

[dev-dependencies]
misty = { workspace = true, features = ["testing"] }
winter-model = { workspace = true, features = ["test-support"] }
