[package]
name = "winter-text"
description = "Winter's text editor: one file as editable text, with Vim and Emacs keys, language servers, completion, and texts compared and merged."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["editor", "vim", "emacs", "terminal"]
categories = ["text-editors"]
rust-version.workspace = true

[dependencies]
serde_json.workspace = true
misty.workspace = true
misty-viento.workspace = true
viento.workspace = true
viento-keys.workspace = true
unicode-width.workspace = true
winter-base.workspace = true
winter-lsp.workspace = true
winter-model.workspace = true
winter-ext-api.workspace = true
winter-syntax.workspace = true

[dev-dependencies]
winter-lsp = { workspace = true, features = ["test-support"] }
winter-model = { workspace = true, features = ["test-support"] }
