[package]
name = "winter-dir"
description = "Winter's directory view: a keyboard-driven listing in a pane, the files it moves, copies, and deletes, and the git state of each."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["file-manager", "terminal", "editor", "dired"]
categories = ["filesystem"]
rust-version.workspace = true

[dependencies]
notify = "8"
winter-base.workspace = true
winter-model.workspace = true
winter-field.workspace = true
winter-vcs.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
winter-model = { workspace = true, features = ["test-support"] }
